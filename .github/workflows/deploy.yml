name: Deploy to ECS

on:
  push:
    branches:
      - dev
      - 'feature/**'
      - 'feature-*'
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/deploy.yml'

env:
  AWS_REGION: ap-south-1
  APP_NAME: Ekabrahma-healthcare
  ENVIRONMENT: dev

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get infrastructure outputs
        id: infra
        run: |
          STACK_NAME="${{ env.APP_NAME }}"

          ECR_URI=$(aws cloudformation describe-stacks --stack-name $STACK_NAME \
            --query 'Stacks[0].Outputs[?OutputKey==`ECRRepositoryUri`].OutputValue' --output text)

          CLUSTER=$(aws cloudformation describe-stacks --stack-name $STACK_NAME \
            --query 'Stacks[0].Outputs[?OutputKey==`ClusterName`].OutputValue' --output text)

          SERVICE=$(aws cloudformation describe-stacks --stack-name $STACK_NAME \
            --query 'Stacks[0].Outputs[?OutputKey==`ServiceName`].OutputValue' --output text)

          TASK_FAMILY=$(aws cloudformation describe-stacks --stack-name $STACK_NAME \
            --query 'Stacks[0].Outputs[?OutputKey==`TaskDefinitionFamily`].OutputValue' --output text)

          echo "ecr_uri=$ECR_URI" >> $GITHUB_OUTPUT
          echo "cluster=$CLUSTER" >> $GITHUB_OUTPUT
          echo "service=$SERVICE" >> $GITHUB_OUTPUT
          echo "task_family=$TASK_FAMILY" >> $GITHUB_OUTPUT

          echo "ECR: $ECR_URI"
          echo "Cluster: $CLUSTER"
          echo "Service: $SERVICE"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        run: |
          IMAGE_TAG=${{ github.sha }}
          ECR_URI=${{ steps.infra.outputs.ecr_uri }}

          docker build -t $ECR_URI:$IMAGE_TAG .
          docker tag $ECR_URI:$IMAGE_TAG $ECR_URI:latest

          docker push $ECR_URI:$IMAGE_TAG
          docker push $ECR_URI:latest

          echo "image=$ECR_URI:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Get current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ steps.infra.outputs.task_family }} \
            --query 'taskDefinition' \
            --output json > task-definition.json

          # Remove fields that can't be used in register-task-definition
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            task-definition.json > clean-task-definition.json

      - name: Update task definition with new image
        run: |
          jq --arg IMAGE "${{ steps.build-image.outputs.image }}" \
            '.containerDefinitions[0].image = $IMAGE | del(.containerDefinitions[0].command)' \
            clean-task-definition.json > new-task-definition.json

      - name: Register new task definition
        id: register-task-def
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task_def_arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT
          echo "Registered: $TASK_DEF_ARN"

      - name: Update ECS service
        run: |
          # Set desired-count to 1 (stack creates with 0 to avoid chicken-egg problem)
          aws ecs update-service \
            --cluster ${{ steps.infra.outputs.cluster }} \
            --service ${{ steps.infra.outputs.service }} \
            --task-definition ${{ steps.register-task-def.outputs.task_def_arn }} \
            --desired-count 1 \
            --force-new-deployment

      - name: Wait for deployment to complete
        run: |
          echo "Waiting for service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ steps.infra.outputs.cluster }} \
            --services ${{ steps.infra.outputs.service }}
          echo "Deployment complete!"

      - name: Get application URL
        id: get-url
        run: |
          CLUSTER=${{ steps.infra.outputs.cluster }}
          SERVICE=${{ steps.infra.outputs.service }}

          TASK_ARN=$(aws ecs list-tasks \
            --cluster $CLUSTER \
            --service-name $SERVICE \
            --query 'taskArns[0]' \
            --output text)

          ENI_ID=$(aws ecs describe-tasks \
            --cluster $CLUSTER \
            --tasks $TASK_ARN \
            --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value' \
            --output text)

          PUBLIC_IP=$(aws ec2 describe-network-interfaces \
            --network-interface-ids $ENI_ID \
            --query 'NetworkInterfaces[0].Association.PublicIp' \
            --output text)

          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "Application URL: http://$PUBLIC_IP:8000"

      - name: Deployment summary
        run: |
          echo "### Deployment Successful! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**App:** ${{ env.APP_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ steps.build-image.outputs.image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Endpoints" >> $GITHUB_STEP_SUMMARY
          echo "- **App:** http://${{ steps.get-url.outputs.public_ip }}:8000" >> $GITHUB_STEP_SUMMARY
          echo "- **Health:** http://${{ steps.get-url.outputs.public_ip }}:8000/health" >> $GITHUB_STEP_SUMMARY
          echo "- **API Docs:** http://${{ steps.get-url.outputs.public_ip }}:8000/api/docs" >> $GITHUB_STEP_SUMMARY
